<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c8102e" />
    <title>BloodSOS Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        margin: 0 auto;
        max-width: 560px;
      }

      .mark {
        align-items: center;
        background: #c8102e;
        border-radius: 24px;
        display: inline-flex;
        font-size: 48px;
        font-weight: 900;
        height: 88px;
        justify-content: center;
        line-height: 1;
        margin-bottom: 24px;
        width: 88px;
      }

      h1 {
        font-size: clamp(32px, 9vw, 56px);
        line-height: 1;
        margin: 0 0 16px;
      }

      p {
        color: #cbd5e1;
        font-size: 18px;
        line-height: 1.7;
        margin: 0;
      }

      a {
        color: #fecdd3;
        display: inline-block;
        font-weight: 800;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">+</div>
      <h1>You are currently offline.</h1>
      <p>
        Live blood availability, emergency requests, appointments, notifications and other real-time services require an
        internet connection.
      </p>
      <a href="/">Try BloodSOS again</a>
    </main>
  </body>
</html>
